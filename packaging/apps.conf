# Lava desktop apps — installed by packaging/install.sh into XDG paths so
# LavaLauncher (and any other freedesktop launcher) can find them.
#
# Fields, pipe-separated:
#   product | Name | GenericName | Comment | icon-name | Categories | Keywords | StartupWMClass | client | MimeType
#
#   product          SwiftPM executable product / binary name under .build/release
#   icon-name        file in packaging/icons/<icon-name>.svg (no extension here)
#   client           1 → Exec prefixes env LAVA_CLIENT=1 (compositor client)
#                    0 → plain Exec (windowed / not a client yet)
#   MimeType         optional, semicolon-terminated. Present → the entry also
#                    gets `%F` on its Exec, so the desktop can hand it the file
#                    that was double-clicked, and install.sh registers the app
#                    as the *default* handler for every type listed (pass
#                    --no-default to skip that). Absent → no MimeType line and
#                    no `%F`, which is what an app that takes no file arguments
#                    wants: a launcher appends nothing, and a stray `%F` in an
#                    Exec is a spec violation some launchers refuse outright.
#
#                    Find names with `gio info -a standard::content-type FILE`,
#                    not with `xdg-mime query filetype`: the latter shells out
#                    to file(1), which has a naming table of its own and answers
#                    `image/x-portable-greymap` where shared-mime-info — the
#                    database every desktop actually resolves handlers through —
#                    says `image/x-portable-graymap`. Register the spelling from
#                    gio; the other one matches nothing.
#
#                    One entry per format the app can open. A type left off is
#                    a file that still opens in something else, which is how
#                    "it only works for JPEG" happens.
#
# Lines starting with # and blank lines are ignored.

LavaView|LavaView|Image Viewer|Show pictures at fit or original size, zoom at the cursor, and step through the folder|lava-view|Graphics;Viewer;Photography;|image;picture;photo;viewer;png;jpeg;raw;cr2;|LavaView|1|image/png;image/jpeg;image/gif;image/bmp;image/x-tga;image/x-portable-pixmap;image/x-portable-graymap;image/x-portable-bitmap;image/x-portable-anymap;image/vnd.radiance;image/svg+xml;image/x-canon-cr2;
LavaShot|LavaShot|Screenshot Tool|Photograph the screen, draw on what matters, then copy it or save it|lava-shot|Graphics;Utility;|screenshot;screen;capture;snip;annotate;|LavaShot|1
LavaWeather|LavaWeather|Weather|Current conditions, the next day, and the week|lava-weather|Utility;X-Meteorology;|weather;forecast;temperature;open-meteo;|LavaWeather|1
LavaTerm|LavaTerm|Terminal Emulator|Terminal emulator for the Lava desktop|lava-term|System;TerminalEmulator;|terminal;shell;console;pty;|LavaTerm|1
LavaEditor|LavaEditor|Text Editor|A plain text editor with tabs, find, and syntax colouring|lava-editor|Utility;TextEditor;Development;|editor;text;code;syntax;|LavaEditor|1
LavaSpotify|LavaSpotify|Music Player|Browse Spotify catalog art and control playback via Connect|lava-spotify|AudioVideo;Audio;Player;|music;spotify;player;connect;|LavaSpotify|1
TraceLoom|TraceLoom|Log Viewer|Pattern-driven log timeline studio|traceloom|Development;Utility;|log;trace;timeline;debug;|TraceLoom|0
LavaSettings|Lava Settings|Settings|Appearance, keyboard, and outputs for the Lava desktop|lava-settings|Settings;DesktopSettings;|settings;desktop;appearance;|LavaSettings|1
