<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LavaExplorer</title>
  <desc id="desc">A warm golden folder on a dark rounded tile — the LavaExplorer application icon.</desc>

  <defs>
    <linearGradient id="tile" x1="80" y1="60" x2="430" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b3f73"/>
      <stop offset="1" stop-color="#171a35"/>
    </linearGradient>

    <linearGradient id="tab" x1="120" y1="160" x2="270" y2="225" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd77d"/>
      <stop offset="1" stop-color="#e7a83f"/>
    </linearGradient>

    <linearGradient id="folder" x1="105" y1="205" x2="410" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffcf6a"/>
      <stop offset="1" stop-color="#d98b2d"/>
    </linearGradient>

    <linearGradient id="front" x1="112" y1="255" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d88929"/>
      <stop offset="1" stop-color="#b96b1e"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0d20" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#tile)"/>

  <!-- Folder -->
  <g filter="url(#shadow)">
    <!-- Back/tab: deliberately behind the folder body -->
    <path
      d="M112 196
         A20 20 0 0 1 132 176
         H218
         L252 210
         H392
         A20 20 0 0 1 412 230
         V258
         H100
         V218
         A22 22 0 0 1 112 196Z"
      fill="url(#tab)"/>

    <!-- Main folder silhouette -->
    <path
      d="M120 204
         H392
         A20 20 0 0 1 412 224
         V354
         A20 20 0 0 1 392 374
         H120
         A20 20 0 0 1 100 354
         V224
         A20 20 0 0 1 120 204Z"
      fill="url(#folder)"/>

    <!-- Front panel -->
    <path
      d="M100 254
         H412
         V354
         A20 20 0 0 1 392 374
         H120
         A20 20 0 0 1 100 354Z"
      fill="url(#front)"/>

    <!-- Subtle highlight on the folder face -->
    <path
      d="M112 266 H400 V344
         A10 10 0 0 1 390 354
         H122 A10 10 0 0 1 112 344Z"
      fill="#f2c477"
      opacity=".18"/>
  </g>
</svg>
