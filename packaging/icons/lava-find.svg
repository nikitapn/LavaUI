<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LavaFind</title>
  <desc id="desc">An amber magnifying glass over a document on a dark rounded tile — the LavaFind application icon.</desc>

  <defs>
    <linearGradient id="tile" x1="80" y1="60" x2="430" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c313d"/>
      <stop offset="1" stop-color="#14171e"/>
    </linearGradient>

    <linearGradient id="page" x1="120" y1="100" x2="330" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9edf3"/>
      <stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>

    <linearGradient id="ring" x1="230" y1="210" x2="390" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc561"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>

    <clipPath id="lens">
      <circle cx="300" cy="300" r="66"/>
    </clipPath>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06070b" flood-opacity=".4"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#tile)"/>

  <!-- Document, with its corner folded -->
  <g filter="url(#shadow)">
    <path d="M136 108 H284 L344 168 V384 A20 20 0 0 1 324 404 H136 A20 20 0 0 1 116 384 V128 A20 20 0 0 1 136 108Z"
          fill="url(#page)"/>
    <path d="M284 108 V148 A20 20 0 0 0 304 168 H344Z" fill="#8d95a3"/>
    <!-- Lines of text -->
    <g fill="#7d8594">
      <rect x="148" y="196" width="128" height="14" rx="7"/>
      <rect x="148" y="232" width="96" height="14" rx="7"/>
      <rect x="148" y="268" width="72" height="14" rx="7"/>
    </g>
  </g>

  <!-- Magnifier: the lens shows the dark tile through the page, the way the
       search bar's amber ring sits on the dark card -->
  <g filter="url(#shadow)">
    <line x1="352" y1="352" x2="410" y2="410" stroke="url(#ring)" stroke-width="36" stroke-linecap="round"/>
    <circle cx="300" cy="300" r="78" fill="#1b1f28" fill-opacity=".88"/>
    <circle cx="300" cy="300" r="78" fill="none" stroke="url(#ring)" stroke-width="26"/>
    <!-- The page's lines, magnified, and the one that matched in amber -->
    <g clip-path="url(#lens)">
      <rect x="244" y="258" width="104" height="18" rx="9" fill="#6f7787"/>
      <rect x="244" y="291" width="132" height="18" rx="9" fill="#f0a43a"/>
      <rect x="244" y="324" width="72" height="18" rx="9" fill="#6f7787"/>
    </g>
  </g>
</svg>
